syntax = "proto3";

package beerproto.v1;

import "buf/validate/validate.proto";

// ---------------------------------------------------------------------------
// CANONICAL UNITS
//
// Every measurement below is a {value, unit} pair, and the two fields answer
// different questions:
//
//   * `value` is ALWAYS stored in the type's canonical unit.
//   * `unit`  carries the unit the measurement is intended to be PRESENTED in.
//
// `unit` is a presentation instruction, NOT a description of `value`.
//
// Example -- a brewer enters a 12 oz hop charge. One ounce avoirdupois is
// exactly 28.349523125 g, so the message is:
//
//   MassType { value: 340.1942775, unit: MASS_UNIT_OZ }
//
// That is 340.1942775 GRAMS, to be shown to the user as "12 oz". It is not
// 340.1942775 ounces. Changing `unit` to MASS_UNIT_KG changes nothing about the
// quantity; the same grams now render as "0.34 kg".
//
// Consumers MUST NOT convert `value` using `unit` -- that double-converts and
// silently corrupts the quantity. Use `value` directly for all arithmetic, and
// read `unit` only when rendering.
//
// At an interop boundary -- BeerJSON, BeerXML, or any format whose {value, unit}
// pairs are self-describing -- convert: write `value` expressed in `unit` on
// export, and normalise into the canonical unit on import.
//
// Three types are EXCLUDED because they have no canonical unit: UnitType,
// EnzymeActivityType and RateType. For those three, and only those three, `unit`
// describes `value` in the ordinary self-describing way.
//
// See "Canonical units" in the repository README for the full convention.
// ---------------------------------------------------------------------------

// Canonical unit: VOLUME_UNIT_ML -- `value` is always in millilitres.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message VolumeType {
  double value = 1;
  VolumeUnit unit = 2;
}

enum VolumeUnit {
  VOLUME_UNIT_UNSPECIFIED = 0;
  // ml
  VOLUME_UNIT_ML = 1;
  // l
  VOLUME_UNIT_L = 2;
  // tsp
  VOLUME_UNIT_TSP = 3;
  // tbsp
  VOLUME_UNIT_TBSP = 4;
  // floz
  VOLUME_UNIT_FLOZ = 5;
  // cup
  VOLUME_UNIT_CUP = 6;
  // pt
  VOLUME_UNIT_PT = 7;
  // qt
  VOLUME_UNIT_QT = 8;
  // gal
  VOLUME_UNIT_GAL = 9;
  // bbl
  VOLUME_UNIT_BBL = 10;
  // ifloz
  VOLUME_UNIT_IFLOZ = 11;
  // ipt
  VOLUME_UNIT_IPT = 12;
  // iqt
  VOLUME_UNIT_IQT = 13;
  // igal
  VOLUME_UNIT_IGAL = 14;
  // ibbl
  VOLUME_UNIT_IBBL = 15;
  // hl -- hectolitre (100 l). The unit commercial breweries quote batch and
  // vessel sizes in, and the rung above the litre on the metric magnitude
  // ladder.
  VOLUME_UNIT_HL = 16;
}

// Canonical unit: MASS_UNIT_G -- `value` is always in grams.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message MassType {
  double value = 1;
  MassUnit unit = 2;
}

enum MassUnit {
  MASS_UNIT_UNSPECIFIED = 0;
  // mg
  MASS_UNIT_MG = 1;
  // g
  MASS_UNIT_G = 2;
  // kg
  MASS_UNIT_KG = 3;
  // lb
  MASS_UNIT_LB = 4;
  // oz
  MASS_UNIT_OZ = 5;
  // t -- metric tonne (1000 kg), the rung above the kilogram on the metric
  // magnitude ladder.
  MASS_UNIT_TONNE = 6;
  // ton -- US short ton (2000 lb), the rung above the pound for US customary.
  MASS_UNIT_SHORT_TON = 7;
  // long ton -- UK long ton (2240 lb), the rung above the pound for British
  // imperial. Distinct from MASS_UNIT_SHORT_TON: the two differ by 12%, so a
  // single "ton" would be ambiguous between the two customary systems.
  MASS_UNIT_LONG_TON = 8;
}

// CellCountType represents a count of viable microorganism (yeast/bacteria) cells, used in yeast pitch-rate calculations. Pitch-rate math is done in billions; cells and millions are provided for display scaling.
//
// Canonical unit: CELL_COUNT_UNIT_BILLION -- `value` is always in billions of cells.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message CellCountType {
  double value = 1;
  CellCountUnit unit = 2;
}

enum CellCountUnit {
  CELL_COUNT_UNIT_UNSPECIFIED = 0;
  // cells
  CELL_COUNT_UNIT_CELLS = 1;
  // M (million, x10^6)
  CELL_COUNT_UNIT_MILLION = 2;
  // B (billion, x10^9)
  CELL_COUNT_UNIT_BILLION = 3;
}

// PitchRateType is a yeast pitch rate — cells pitched per unit wort volume per unit gravity. There is one unit in common brewing use (million cells / mL / °Plato), so it exists mainly for type-safety and consistent display rather than conversion.
//
// Canonical unit: PITCH_RATE_UNIT_MILLION_CELLS_PER_ML_PER_PLATO -- `value` is always in million cells / ml / degPlato.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// The only real unit in the enum, so the canonical unit and the presentation
// unit are necessarily the same.
//
// See "Canonical units" in the repository README for the full convention.
message PitchRateType {
  double value = 1;
  PitchRateUnit unit = 2;
}

enum PitchRateUnit {
  PITCH_RATE_UNIT_UNSPECIFIED = 0;
  // M cells / mL / °Plato
  PITCH_RATE_UNIT_MILLION_CELLS_PER_ML_PER_PLATO = 1;
}

// Diastatic power is a measurement of malted grains enzymatic content. A value of 35 Lintner (106.5 WK) is needed to self convert, while a value of 100 Lintner (334 WK) or more is desirable for base malts
//
// Canonical unit: DIASTATIC_POWER_UNIT_WK -- `value` is always in degrees Windisch-Kolbach.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// The two scales are related by an affine transform, not a scaling:
//   degWK = (3.5 x degLintner) - 16      degLintner = (degWK + 16) / 3.5
// Zero does not survive that conversion -- 0 degLintner is -16 degWK -- which
// has two consequences. Canonical degWK values are NEGATIVE for any malt below
// 4.57 degLintner, so `value > 0` must never be used as a presence or validity
// test. And a missing diastatic power is not 0 degWK; test presence on the
// enclosing message.
//
// See "Canonical units" in the repository README for the full convention.
message DiastaticPowerType {
  double value = 1;
  DiastaticPowerUnit unit = 2;
}

enum DiastaticPowerUnit {
  DIASTATIC_POWER_UNIT_UNSPECIFIED = 0;
  // Lintner
  DIASTATIC_POWER_UNIT_LINTNER = 1;
  // Windisch–Kolbach
  DIASTATIC_POWER_UNIT_WK = 2;
}

// Canonical unit: TEMPERATURE_UNIT_C -- `value` is always in degrees Celsius.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message TemperatureType {
  double value = 1;
  TemperatureUnit unit = 2;
}

enum TemperatureUnit {
  TEMPERATURE_UNIT_UNSPECIFIED = 0;
  TEMPERATURE_UNIT_C = 1;
  TEMPERATURE_UNIT_F = 2;
}

// Canonical unit: ACIDITY_UNIT_PH -- `value` is always in pH.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// The only real unit in the enum, so the canonical unit and the presentation
// unit are necessarily the same.
//
// pH is a logarithmic scale; it is never rescaled, only carried.
//
// See "Canonical units" in the repository README for the full convention.
message AcidityType {
  double value = 1;
  AcidityUnit unit = 2;
}

enum AcidityUnit {
  ACIDITY_UNIT_UNSPECIFIED = 0;
  ACIDITY_UNIT_PH = 1;
}

// Canonical unit: TITRATABLE_ACIDITY_UNIT_G_PER_L_TARTARIC -- `value` is
// always in grams per litre expressed as tartaric acid.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// Titratable acidity is how much acid is actually *in* a juice, as against
// AcidityType's pH, which is how strongly the free protons of it are showing.
// The two move together but neither predicts the other: two ciders at the same
// pH can differ by half again in TA depending on how much potassium the fruit
// carried, and it is the TA that a drinker tastes as sharpness.
//
// Separate from AcidityType rather than another unit inside it, because they
// are not the same quantity. pH is a logarithmic scale that is never rescaled;
// TA is a concentration. One message cannot have both as its canonical unit,
// and a `value` whose meaning depended on which arm of the enum was set would
// break the convention this file is built on.
//
// The unit is "as <acid>" because a titration counts equivalents of acid and
// then reports them as the mass of whichever acid the trade quotes. Neither is
// more correct; they differ by the ratio of their equivalent weights, which is
// exact:
//
//   tartaric (150.087 g/mol, diprotic) -> 75.044 g/eq
//   malic    (134.087 g/mol, diprotic) -> 67.044 g/eq
//   1 g/L as malic = 1.1193 g/L as tartaric
//
// Tartaric is canonical because it is the international analytical convention
// (OIV, and every wine lab result). Cider is quoted as malic almost
// everywhere, so a cider UI will display malic and convert -- which is exactly
// what `unit` is for.
message TitratableAcidityType {
  double value = 1;
  TitratableAcidityUnit unit = 2;
}

enum TitratableAcidityUnit {
  TITRATABLE_ACIDITY_UNIT_UNSPECIFIED = 0;
  // Grams per litre as tartaric acid -- wine convention, and canonical here.
  TITRATABLE_ACIDITY_UNIT_G_PER_L_TARTARIC = 1;
  // Grams per litre as malic acid -- cider and perry convention.
  TITRATABLE_ACIDITY_UNIT_G_PER_L_MALIC = 2;
}

// Canonical unit: TIME_UNIT_SEC -- `value` is always in seconds.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// `value` is an int64, not a double -- the only measurement here that is.
// Seconds is canonical precisely because of that: minutes would make any
// sub-minute duration (a whirlpool rest, a short hop stand) unrepresentable,
// and would silently round a 30 second step up to one minute.
//
// See "Canonical units" in the repository README for the full convention.
message TimeType {
  int64 value = 1;
  TimeUnit unit = 2;
}

enum TimeUnit {
  TIME_UNIT_UNSPECIFIED = 0;
  // sec
  TIME_UNIT_SEC = 1;
  // min
  TIME_UNIT_MIN = 2;
  // hr
  TIME_UNIT_HR = 3;
  // day
  TIME_UNIT_DAY = 4;
  // week
  TIME_UNIT_WEEK = 5;
}

// ColorType supports both grain color properties, such as Lovibond, and wort color properties such as SRM and EBC
//
// Canonical unit: COLOR_UNIT_EBC -- `value` is always in EBC.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// EBC and SRM are linearly related and convert losslessly. Lovibond is not a
// third scale to convert through: the Daniels relation
// SRM = 1.3546 x degL - 0.76 is a curve fit of MCU-to-SRM data, not a unit
// conversion, and must never be applied to an individual malt colour.
//
// See "Canonical units" in the repository README for the full convention.
message ColorType {
  double value = 1;
  ColorUnit unit = 2;
}

enum ColorUnit {
  COLOR_UNIT_UNSPECIFIED = 0;
  // EBC
  COLOR_UNIT_EBC = 1;
  // Lovi
  COLOR_UNIT_LOVI = 2;
  // SRM
  COLOR_UNIT_SRM = 3;
}

// Canonical unit: CARBONATION_UNIT_VOLS -- `value` is always in volumes of CO2.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message CarbonationType {
  double value = 1;
  CarbonationUnit unit = 2;
}

enum CarbonationUnit {
  CARBONATION_UNIT_UNSPECIFIED = 0;
  // vols
  CARBONATION_UNIT_VOLS = 1;
  // g/l
  CARBONATION_UNIT_GL = 2;
}

// Canonical unit: BITTERNESS_UNIT_IBUS -- `value` is always in IBU.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// The only real unit in the enum, so the canonical unit and the presentation
// unit are necessarily the same.
//
// See "Canonical units" in the repository README for the full convention.
message BitternessType {
  double value = 1;
  BitternessUnit unit = 2;
}

enum BitternessUnit {
  BITTERNESS_UNIT_UNSPECIFIED = 0;
  // IBUs
  BITTERNESS_UNIT_IBUS = 1;
}

// Gravity refers to the both the measurements of percent of sugar content, ie plato and brix, as well as relative density ie specific gravity
//
// Canonical unit: GRAVITY_UNIT_SG -- `value` is always in specific gravity.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// SG and Plato are related through a cubic, so the round trip is not
// algebraically lossless. The error is well below hydrometer and refractometer
// resolution, so SG is safe as the stored form -- but extract-basis maths
// (attenuation, real extract) should convert to Plato explicitly and do its
// arithmetic there.
//
// See "Canonical units" in the repository README for the full convention.
message GravityType {
  double value = 1;
  GravityUnit unit = 2;
}

enum GravityUnit {
  GRAVITY_UNIT_UNSPECIFIED = 0;
  // sg
  GRAVITY_UNIT_SG = 1;
  // plato
  GRAVITY_UNIT_PLATO = 2;
  // brix
  GRAVITY_UNIT_BRIX = 3;
}

// Canonical unit: SPECIFIC_HEAT_UNIT_JKGK -- `value` is always in joules per kilogram-kelvin.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message SpecificHeatType {
  double value = 1;
  SpecificHeatUnit unit = 2;
}

enum SpecificHeatUnit {
  SPECIFIC_HEAT_UNIT_UNSPECIFIED = 0;
  // Cal/(g C)
  SPECIFIC_HEAT_UNIT_CALGC = 1;
  // J/(kg K)
  SPECIFIC_HEAT_UNIT_JKGK = 2;
  // BTU/(lb F)
  SPECIFIC_HEAT_UNIT_BTULBF = 3;
}

// Canonical unit: CONCENTRATION_UNIT_MGL -- `value` is always in milligrams per litre.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// For dilute aqueous solutions 1 mg/l is numerically 1 ppm, because a litre of
// brewing liquor weighs a kilogram, so this and PartsPerType interchange
// without arithmetic. The types stay distinct all the same: this one is a mass
// per volume, PartsPerType is a pure ratio, and the equivalence stops holding
// for anything not around 1 kg/l.
//
// See "Canonical units" in the repository README for the full convention.
message ConcentrationType {
  double value = 1;
  ConcentrationUnit unit = 2;
}

enum ConcentrationUnit {
  CONCENTRATION_UNIT_UNSPECIFIED = 0;
  // ppm
  CONCENTRATION_UNIT_PPM = 1;
  // ppb
  CONCENTRATION_UNIT_PPB = 2;
  // mg/l
  CONCENTRATION_UNIT_MGL = 3;
  // mg/100g
  CONCENTRATION_UNIT_MG100L = 4;
}

// Canonical unit: SPECIFIC_VOLUME_UNIT_LKG -- `value` is always in litres per kilogram.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// Not SPECIFIC_VOLUME_UNIT_M3KG: the SI unit puts a mash thickness of 2.5 l/kg
// at 0.0025, and canonical units are chosen to keep typical values legible and
// near-integral.
//
// See "Canonical units" in the repository README for the full convention.
message SpecificVolumeType {
  double value = 1;
  SpecificVolumeUnit unit = 2;
}

enum SpecificVolumeUnit {
  SPECIFIC_VOLUME_UNIT_UNSPECIFIED = 0;
  // qt/lb
  SPECIFIC_VOLUME_UNIT_QTLB = 1;
  // gal/lb
  SPECIFIC_VOLUME_UNIT_GALLB = 2;
  // gal/oz
  SPECIFIC_VOLUME_UNIT_GALOZ = 3;
  // l/g
  SPECIFIC_VOLUME_UNIT_LG = 4;
  // l/kg
  SPECIFIC_VOLUME_UNIT_LKG = 5;
  // floz/oz
  SPECIFIC_VOLUME_UNIT_FLOZOZ = 6;
  // m^3/kg
  SPECIFIC_VOLUME_UNIT_M3KG = 7;
  // ft^3/lb
  SPECIFIC_VOLUME_UNIT_FT3LB = 8;
}

// UnitType is used where unitless amounts are required, such as 1 apple, or 1 yeast packet
//
// NO canonical unit -- excluded from the canonical convention.
//
// For this type `unit` DESCRIBES `value` in the ordinary self-describing way,
// rather than naming a presentation unit.
//
// These units are discrete counts and no conversion between them exists or
// can exist: a package is not a number of "each". Compare values only when
// the units already match.
//
// See "Canonical units" in the repository README for the full convention.
message UnitType {
  double value = 1;
  UnitUnit unit = 2;
}

enum UnitUnit {
  UNIT_UNIT_UNSPECIFIED = 0;
  // 1
  UNIT_UNIT_ONE = 1;
  // unit
  UNIT_UNIT_UNIT = 2;
  // each
  UNIT_UNIT_EACH = 3;
  // dimensionless
  UNIT_UNIT_DIMENSIONLESS = 4;
  // pkg
  UNIT_UNIT_PKG = 5;
}

// Canonical unit: PERCENT_UNIT_PERCENT_SIGN -- `value` is always in percent.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// The only real unit in the enum, so the canonical unit and the presentation
// unit are necessarily the same.
//
// See "Canonical units" in the repository README for the full convention.
message PercentType {
  double value = 1;
  PercentUnit unit = 2;
}

enum PercentUnit {
  PERCENT_UNIT_UNSPECIFIED = 0;
  // %
  PERCENT_UNIT_PERCENT_SIGN = 1;
}

// Molar mass — the mass of one mole of a substance. Used for the brewing salt
// and acid chemistry, where ion contributions and neutralising power are
// derived from formula masses rather than tabulated.
//
// Canonical unit: MOLAR_UNIT_GMOL -- `value` is always in grams per mole.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// The only real unit in the enum, so the canonical unit and the presentation
// unit are necessarily the same.
//
// See "Canonical units" in the repository README for the full convention.
message MolarType {
  double value = 1;
  MolarUnit unit = 2;
}

enum MolarUnit {
  MOLAR_UNIT_UNSPECIFIED = 0;
  // g/mol
  MOLAR_UNIT_GMOL = 1;
}

// A dimensionless ratio expressed as parts per some power of ten.
//
// Distinct from ConcentrationType, which mixes true concentrations (mg/l,
// mg/100g) in with ppm/ppb: this one is only ever a ratio, so it converts
// cleanly between its own units by powers of a thousand and never needs to know
// what is dissolved in what.
//
// Canonical unit: PARTS_PER_UNIT_MILLION -- `value` is always in parts per million.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message PartsPerType {
  double value = 1;
  PartsPerUnit unit = 2;
}

enum PartsPerUnit {
  PARTS_PER_UNIT_UNSPECIFIED = 0;
  // ppm — parts per million
  PARTS_PER_UNIT_MILLION = 1;
  // ppb — parts per billion
  PARTS_PER_UNIT_BILLION = 2;
  // ppt — parts per trillion
  PARTS_PER_UNIT_TRILLION = 3;
}

// The acid or base a material absorbs per unit mass to move one pH unit — how
// hard it resists a change in pH.
//
// Used for mash pH prediction, where each fermentable's buffering is what makes
// a large grist need proportionally more acid than a small one to reach the
// same pH. Only meaningful alongside a distilled-water pH, which fixes the
// point the titration curve is measured from.
//
// Canonical unit: BUFFERING_CAPACITY_UNIT_MEQ_KG_PH -- `value` is always in milliequivalents per kilogram per pH unit.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// The only real unit in the enum, so the canonical unit and the presentation
// unit are necessarily the same.
//
// See "Canonical units" in the repository README for the full convention.
message BufferingCapacityType {
  double value = 1;
  BufferingCapacityUnit unit = 2;
}

enum BufferingCapacityUnit {
  BUFFERING_CAPACITY_UNIT_UNSPECIFIED = 0;
  // mEq/(kg·pH) — milliequivalents of acid per kilogram per pH unit
  BUFFERING_CAPACITY_UNIT_MEQ_KG_PH = 1;
}

// Canonical unit: VISCOSITY_UNIT_MPAS -- `value` is always in millipascal-seconds.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// 1 cP = 1 mPa-s exactly, so the choice costs nothing.
//
// See "Canonical units" in the repository README for the full convention.
message ViscosityType {
  double value = 1;
  ViscosityUnit unit = 2;
}

enum ViscosityUnit {
  VISCOSITY_UNIT_UNSPECIFIED = 0;
  // cP
  VISCOSITY_UNIT_CP = 1;
  // mPa-s
  VISCOSITY_UNIT_MPAS = 2;

  // P
   VISCOSITY_UNIT_POISE = 3;
}

message CarbonationRangeType {
  CarbonationType minimum = 1;
  CarbonationType maximum = 2;
}

message BitternessRangeType {
  BitternessType minimum = 1;
  BitternessType maximum = 2;
}

message TemperatureRangeType {
  TemperatureType minimum = 1;
  TemperatureType maximum = 2;
}

message ColorRangeType {
  ColorType minimum = 1;
  ColorType maximum = 2;
}

message GravityRangeType {
  GravityType minimum = 1;
  GravityType maximum = 2;
}

message PercentRangeType {
  PercentType minimum = 1;
  PercentType maximum = 2;
}

message TimeRangeType {
  TimeType minimum = 1;
  TimeType maximum = 2;
}

message ViscosityRangeType {
  ViscosityType minimum = 1;
  ViscosityType maximum = 2;
}

message DiastaticPowerRangeType {
  DiastaticPowerType minimum = 1;
  DiastaticPowerType maximum = 2;
}

message SpecificVolumeRangeType {
  SpecificVolumeType minimum = 1;
  SpecificVolumeType maximum = 2;
}

message AcidityRangeType {
  AcidityType minimum = 1;
  AcidityType maximum = 2;
}

message ConcentrationRangeType {
  ConcentrationType minimum = 1;
  ConcentrationType maximum = 2;
}

enum RateUnit {
  RATE_UNIT_UNSPECIFIED = 0;

  // Volume-based rates
  RATE_UNIT_L_PER_HOUR = 1;
  RATE_UNIT_L_PER_MINUTE = 2;
  RATE_UNIT_GAL_PER_HOUR = 3;
  RATE_UNIT_GAL_PER_MINUTE = 9;
  RATE_UNIT_HL_PER_HOUR = 10;
  RATE_UNIT_BBL_PER_HOUR = 11;     // US beer barrel (31 US gal)
  RATE_UNIT_UK_BBL_PER_HOUR = 12;  // UK brewers' barrel (36 imp gal)

  // Percent-based rates (useful for boil-off)
  RATE_UNIT_PERCENT_PER_HOUR = 4;

  // Mass absorption (common in brewing calculations)
  RATE_UNIT_L_PER_KG = 5;
  RATE_UNIT_GAL_PER_LB = 6;

  // Temperature change rates (useful for step mashes)
  RATE_UNIT_C_PER_MINUTE = 7;
  RATE_UNIT_F_PER_MINUTE = 8;
}

// use for things like evaporation rate, grain absorption rate, lauter flow rate, etc.
//
// NO canonical unit -- excluded from the canonical convention.
//
// For this type `unit` DESCRIBES `value` in the ordinary self-describing way,
// rather than naming a presentation unit.
//
// RateUnit spans four dimensions in one enum: volume flow (L_PER_HOUR,
// BBL_PER_HOUR), percent rate (PERCENT_PER_HOUR), specific volume (L_PER_KG)
// and temperature rate (C_PER_MINUTE). A single canonical unit is not
// meaningful.
//
// See "Canonical units" in the repository README for the full convention.
message RateType {
  double value = 1;
  RateUnit unit = 2;
}



enum PressureUnit {
  PRESSURE_UNIT_UNSPECIFIED = 0;
  PRESSURE_UNIT_PASCAL = 1;
  PRESSURE_UNIT_BAR = 2;
  PRESSURE_UNIT_PSI = 3;
  PRESSURE_UNIT_KPA = 4;
}

// Canonical unit: PRESSURE_UNIT_PASCAL -- `value` is always in pascals.
// `unit` names the unit this measurement should be presented in and never
// describes `value`.
//
// See "Canonical units" in the repository README for the full convention.
message PressureType {
  double value = 1;
  PressureUnit unit = 2;
}

// NO canonical unit -- excluded from the canonical convention.
//
// For this type `unit` DESCRIBES `value` in the ordinary self-describing way,
// rather than naming a presentation unit.
//
// DU, WK and SKB are three different laboratory assays, not three scalings
// of one quantity. There is no defensible conversion factor between them.
//
// See "Canonical units" in the repository README for the full convention.
message EnzymeActivityType {
  // Numeric activity value as reported by the lab
  double value = 1 [
  (buf.validate.field).double.gte = 0
  ];

  // Unit of enzyme activity
  EnzymeActivityUnit unit = 2 [
  (buf.validate.field).required = true
  ];
}

/**
* Enzyme activity units used in brewing and cereal chemistry.
*
* DU is the de-facto standard for alpha amylase in malt specs.
*/
enum EnzymeActivityUnit {
  ENZYME_ACTIVITY_UNIT_UNSPECIFIED = 0;

  // Dextrinizing Units (ASBC method, most common for alpha amylase)
  ENZYME_ACTIVITY_UNIT_DU = 1;

  // Windisch–Kolbach units (more common in European malt specs)
  ENZYME_ACTIVITY_UNIT_WK = 2;

  // SKB units (Sandstedt–Kneen–Blish, older standard)
  ENZYME_ACTIVITY_UNIT_SKB = 3;
}

enum EnzymeType {
  ENZYME_TYPE_UNSPECIFIED = 0;
  ENZYME_TYPE_ALPHA_AMYLASE = 1;
  ENZYME_TYPE_BETA_AMYLASE = 2;
  ENZYME_TYPE_PROTEASE = 3;
}

message EnzymeActivity {
  EnzymeType kind = 1;
  EnzymeActivityType activity = 2;
}
